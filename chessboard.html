<!DOCTYPE html>
<html>
<head>
    <meta charset='UTF-8'>
    <style>
.chess-board {
    border-spacing: 0;
    border-collapse: collapse;
    
    .white-piece {
        color: white;
        text-shadow: 0 0 10px black;
    }
    
    tr:last-child td {
        border-bottom: 1px solid;
    }
    
    th {
        padding: .5em;
        font-size: 24px;
    }

    th + th {
        border-bottom: 1px solid black;
    }

    th:first-child, td:last-child {
        border-right: 1px solid black;
    }

    th:empty {
        border: none;
    }

    td {
        width: 65px;
        height: 65px;
        text-align: center;
        font-size: 64px;
        line-height: 0;
    }

    tr:nth-child(even) td:nth-child(even),
    tr:nth-child(odd) td:nth-child(odd) {
        background: #eee;
        --highlighted-color: yellow;
    }

    tr:nth-child(odd) td:nth-child(even),
    tr:nth-child(even) td:nth-child(odd) {
        background: #aaa;
        --highlighted-color: gold;
    }
}
    </style>
</head>
<body>
    <table class='chess-board' id='board'></table>

    <script>
const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
const ranks = [8, 7, 6, 5, 4, 3, 2, 1];
let currentFen = '';
    
function resetBoard() {
    const board = window['board'];
    board.textContent = '';

    const initialPosition = {
        8: ['♜','♞','♝','♛','♚','♝','♞','♜'],
        7: Array(8).fill('♟'),
        2: Array(8).fill('♟'),
        1: ['♜','♞','♝','♛','♚','♝','♞','♜']
    };

    const headerRow = document.createElement('tr');    
    headerRow.appendChild(document.createElement('th'));
    
    for (const file of files) {
        const th = document.createElement('th');
        th.textContent = file;
        headerRow.appendChild(th);
    }
    
    board.appendChild(headerRow);

    for (const rank of ranks) {
        const row = document.createElement('tr');
        
        const th = document.createElement('th');
        th.textContent = rank;
        row.appendChild(th);

        for (let f = 0; f < 8; ++f) {
            const file = files[f];
            const td = document.createElement('td');
            td.id = file + rank;

            if (initialPosition[rank]) {
                const piece = document.createElement('span');            
                piece.textContent = initialPosition[rank][f];
                
                if (rank <= 2) {
                    piece.className = 'white-piece';
                }
                
                td.appendChild(piece);
            }
            
            row.appendChild(td);
        }

        board.appendChild(row);
    }
    
    currentFen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR';
}
    
function setPosition(fen) {
    const previousFen = currentFen;
    currentFen = '';
    
    const newFen = fen.trim().split(/\s+/)[0];
    const rows = newFen.split('/');

    if (rows.length !== 8) {
        throw `Invalid FEN rank count: expected 8, got ${rows.length}`;
    }
    
    const symbols = {
        'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟'
    };

    for (const file of files) {
        for (const rank of ranks) {
            window[file + rank].textContent = '';
            window[file + rank].removeAttribute('style');
        }
    }

    for (let i = 0; i < 8; ++i) {
        const rank = ranks[i];
        const row = rows[i];
        let fileIndex = 0;

        for (const ch of row) {
            if (/[1-8]/.test(ch)) {
                fileIndex += parseInt(ch);
                continue;
            }
            
            const symbol = symbols[ch.toLowerCase()];
            
            if (!symbol) {
                throw `Invalid FEN character '${ch}' in rank ${rank}`;
            }
            
            const file = files[fileIndex];
            const cell = window[file + rank];
            
            const piece = document.createElement('span');            
            piece.textContent = symbol;
            
            if (ch === ch.toUpperCase()) {
                piece.className = 'white-piece';
            }
            
            cell.appendChild(piece);            
            ++fileIndex;
        }

        if (fileIndex !== 8) {
            throw `Invalid FEN row at rank ${rank}: expected 8 files, got ${fileIndex}`;
        }
    }
    
    currentFen = newFen;
}

function highlightElement(id) {
    window[id].style.background = 'var(--highlighted-color)';
}

resetBoard();
    </script>
</body>
</html>
